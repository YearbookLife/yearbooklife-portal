<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YearbookLife Portal — Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #14b8a6 0%, #0891b2 100%);
      padding: 30px 24px;
      text-align: center;
    }
    .logo-box {
      background: white;
      display: inline-block;
      padding: 10px 22px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .logo-box .yb { font-size: 24px; font-weight: 700; color: #5f5e5a; }
    .logo-box .life { font-size: 24px; font-weight: 700; color: #14b8a6; }
    .login-header p { color: #d1faf5; font-size: 14px; margin-top: 4px; }
    .login-body { padding: 32px 28px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-weight: 600; color: #0f172a;
      margin-bottom: 8px; font-size: 14px;
    }
    .form-group input {
      width: 100%; padding: 13px 16px; border: 2px solid #e2e8f0;
      border-radius: 8px; font-size: 15px; font-family: inherit;
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none; border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20,184,166,0.1);
    }
    .login-btn {
      width: 100%; background: #14b8a6; color: white; border: none;
      padding: 14px; font-size: 16px; font-weight: 600; border-radius: 8px;
      cursor: pointer; transition: all 0.2s;
    }
    .login-btn:hover { background: #0d9488; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .message {
      margin-top: 18px; padding: 14px 16px; border-radius: 8px;
      font-size: 14px; font-weight: 500; display: none; line-height: 1.5;
    }
    .message.error {
      display: block; background: #fee2e2; border: 2px solid #fca5a5; color: #991b1b;
    }
    .message.success {
      display: block; background: #d1fae5; border: 2px solid #6ee7b7; color: #065f46;
    }
    .message.info {
      display: block; background: #dbeafe; border: 2px solid #93c5fd; color: #1e40af;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="logo-box"><span class="yb">Yearbook</span><span class="life">Life</span></div>
      <p>Customer Portal Login</p>
    </div>
    <div class="login-body">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@yourschool.org" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Log In</button>
      <div class="message" id="message"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabaseClient = null;

    // Load the public Supabase config, then set up the client
    async function initSupabase() {
      try {
        const resp = await fetch('/api/supabase-config');
        const cfg = await resp.json();
        if (!cfg.url || !cfg.anonKey) {
          showMessage('Login is not configured yet. Please contact support.', 'error');
          return;
        }
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
      } catch (err) {
        console.error('Config load error:', err);
        showMessage('Could not connect to the login service. Please try again.', 'error');
      }
    }
    initSupabase();

    function showMessage(text, type) {
      const m = document.getElementById('message');
      m.textContent = text;
      m.className = 'message ' + type;
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !password) {
        showMessage('Please enter both your email and password.', 'error');
        return;
      }
      if (!supabaseClient) {
        showMessage('Still connecting to the login service — please wait a moment and try again.', 'info');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          showMessage(error.message || 'Login failed. Please check your email and password.', 'error');
          btn.disabled = false;
          btn.textContent = 'Log In';
          return;
        }
        // Phase 1 success — just prove it works
        showMessage('✅ Success! You are logged in as ' + data.user.email + '. (Next phase: this will open your dashboard.)', 'success');
        btn.textContent = 'Logged In ✓';
      } catch (err) {
        console.error('Login error:', err);
        showMessage('Something went wrong. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
